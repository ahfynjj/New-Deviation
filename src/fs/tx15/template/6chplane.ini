; TX15 factory profile: flight mode SA, gyro SB, hold/gear SE.
template=6Ch Airplane
automap=1
type=plane
[radio]
num_channels=6

[channel1]
template=expo_dr
[mixer]
src=ELE
dest=CH1
[mixer]
src=ELE
dest=CH1
switch=SW D1
scalar=60

[channel2]
template=complex
[mixer]
src=AIL
dest=CH2
[mixer]
src=AIL
dest=CH2
switch=SW C1
scalar=60

[channel3]
template=simple
[mixer]
src=THR
dest=CH3

[channel4]
template=expo_dr
[mixer]
src=RUD
dest=CH4
[mixer]
src=RUD
dest=CH4
switch=SW A1
scalar=60

[channel5]
template=simple
[mixer]
src=SW E1
dest=CH5

[channel6]
template=expo_dr
[mixer]
src=SW B0
dest=CH6
scalar=-100
[mixer]
src=SW B0
dest=CH6
switch=SW B1
scalar=0
[mixer]
src=SW B0
dest=CH6
switch=SW B2
scalar=100

[trim1]
src=LEFT_V
pos=TRIMLV+
neg=TRIMLV-
[trim2]
src=RIGHT_V
pos=TRIMRV+
neg=TRIMRV-
[trim3]
src=LEFT_H
pos=TRIMLH+
neg=TRIMLH-
[trim4]
src=RIGHT_H
pos=TRIMRH+
neg=TRIMRH-
